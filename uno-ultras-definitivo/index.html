<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <title>UNO ULTRAS DEFINITIVO - Beta Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="bg-animated">
      <svg class="bg-svg" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="g1" cx="50%" cy="50%" r="80%" fx="60%" fy="40%" gradientTransform="rotate(25)">
            <stop offset="0%" stop-color="#45e8cf" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#070b16" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="g2" cx="50%" cy="50%" r="80%" fx="30%" fy="80%">
            <stop offset="0%" stop-color="#ff7ca5" stop-opacity="0.13"/>
            <stop offset="100%" stop-color="#070b16" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <ellipse cx="1100" cy="400" rx="700" ry="320" fill="url(#g1)">
          <animate attributeName="rx" values="700;800;700" dur="8s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="600" cy="900" rx="500" ry="180" fill="url(#g2)">
          <animate attributeName="ry" values="180;260;180" dur="12s" repeatCount="indefinite"/>
        </ellipse>
      </svg>
      <div class="bg-overlay"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
