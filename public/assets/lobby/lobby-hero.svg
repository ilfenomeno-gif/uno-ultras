<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Lobby hero arena style">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#192e63"/>
      <stop offset="60%" stop-color="#102447"/>
      <stop offset="100%" stop-color="#0a1328"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.78" cy="0.24" r="0.42">
      <stop offset="0%" stop-color="#45e3ff" stop-opacity="0.68"/>
      <stop offset="55%" stop-color="#45e3ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#45e3ff" stop-opacity="0"/>
